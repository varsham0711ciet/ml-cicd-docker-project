version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/ml-app
    overwrite: true

hooks:
  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root

  ApplicationStop:
    - location: scripts/stop_container.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 600
      runas: root

  ValidateService:
    - location: scripts/validate.sh
      timeout: 120
      runas: root
